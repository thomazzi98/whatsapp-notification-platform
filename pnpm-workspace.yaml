packages:
  - apps/*
  - packages/*
  - tools/*

# pnpm 11 gates dependency install scripts behind an explicit allowlist.
# `allowBuilds` replaced the legacy `onlyBuiltDependencies` key.
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  # Transitive dependencies of testcontainers. All three are optional native
  # accelerations for an SSH transport this project never uses, so their build
  # scripts are declined rather than left undecided.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Its install script writes a service worker for intercepting requests in a
  # real browser. The component tests intercept in Node, so the script has
  # nothing to do here.
  msw: false

# Forced across the whole tree, transitive dependencies included.
overrides:
  # GHSA-w2qp-rph6-63g4, GHSA-3m5p-2c4r-xxw2 and one further advisory, all fixed
  # in 5.12.1. @nestjs/platform-fastify@11.2.3 depends on 5.11.3 exactly and has
  # no newer release, so the override is the only way to be on a patched Fastify
  # while still loading a single copy of it.
  fastify: 5.12.3
  # GHSA-67mh-4wv8-2f99. Reached only through drizzle-kit's legacy
  # "@esbuild-kit" loader, which is a development dependency, but an advisory
  # that is merely unreachable today is one nobody re-reads tomorrow.
  esbuild: ^0.25.12

# Versions are declared once here and referenced as "catalog:" by every
# workspace package, so a shared dependency cannot drift between packages.
catalog:
  # Language and tooling
  typescript: 5.9.3
  vitest: 4.1.11
  "@vitest/coverage-v8": 4.1.11
  eslint: 10.10.0
  rimraf: 6.1.2
  tsx: 4.23.13

  # Shared runtime libraries
  zod: 4.5.4
  pino: 10.3.1
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  pg: 8.23.0
  "@types/pg": 8.23.1
  testcontainers: 12.1.0
  "@testcontainers/postgresql": 12.1.0

  # HTTP stack. The Nest packages move together and must stay on one line.
  "@nestjs/common": 11.2.3
  "@nestjs/core": 11.2.3
  "@nestjs/platform-fastify": 11.2.3
  "@nestjs/testing": 11.2.3
  # One Fastify in the process, and it must be a patched one. The Nest adapter
  # pins 5.11.3 exactly, which carries three advisories, so the override above
  # lifts the whole tree to the patched release rather than leaving two copies.
  fastify: 5.12.3
  "@fastify/cookie": 11.1.2
  reflect-metadata: 0.2.2
  rxjs: 7.8.2

  # Credentials
  "@node-rs/argon2": 2.2.0

  # Queue
  pg-boss: 12.30.0

  # Dashboard. React 19 and Vite 8 are current; React Router is used in its
  # library mode as a single page application, because the dashboard has no
  # server rendering need and a second Node process next to the API would make
  # "which one owns the session" an open question.
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  react-router: 8.3.1
  "@tanstack/react-query": 5.102.8
  vite: 8.2.2
  "@vitejs/plugin-react": 6.1.1
  # The Vite plugin is the supported path for Tailwind 4; the PostCSS pipeline
  # is the legacy one.
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3

  # Component tests for the dashboard. jsdom rather than a real browser: these
  # answer "does this component say the right thing in this state", which is a
  # question a browser makes slower without making more truthful.
  "@testing-library/react": 16.3.3
  "@testing-library/user-event": 14.6.7
  "@testing-library/jest-dom": 7.0.1
  jsdom: 30.0.1
  msw: 2.15.0
  # Used directly rather than through a matcher package: the wrappers lag the
  # test runner by a major version, and the assertion is four lines.
  axe-core: 4.13.0

  # End to end. Driven against the production images, so the deployment path is
  # never the untested one.
  "@playwright/test": 1.63.0
  # The same engine as the component tests use, in a real browser, where the
  # rules that need layout and colour can actually run.
  "@axe-core/playwright": 4.13.0
