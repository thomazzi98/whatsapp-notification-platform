name: whatsapp-notification-platform

# Host ports are bound to 127.0.0.1 and shifted off the defaults, so this stack
# cannot collide with another project's Postgres or be reached from the network.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_SYSTEM_USER:-platform_system}
      POSTGRES_PASSWORD: ${DATABASE_SYSTEM_PASSWORD:-platform_system_password}
      POSTGRES_DB: ${DATABASE_NAME:-notifications}
      APPLICATION_DATABASE_USER: ${DATABASE_APPLICATION_USER:-platform_application}
      APPLICATION_DATABASE_PASSWORD: ${DATABASE_APPLICATION_PASSWORD:-platform_application_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_SYSTEM_USER:-platform_system} -d ${DATABASE_NAME:-notifications}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # A one-shot barrier. The API and the worker depend on this completing, which
  # removes the startup race where several processes migrate concurrently.
  migrate:
    build:
      context: .
      dockerfile: tools/docker/node-service.Dockerfile
      args:
        PACKAGE_NAME: "@platform/queue"
    command: ["node", "dist/cli/bootstrap.js"]
    restart: "no"
    environment:
      DATABASE_SYSTEM_URL: postgres://${DATABASE_SYSTEM_USER:-platform_system}:${DATABASE_SYSTEM_PASSWORD:-platform_system_password}@postgres:5432/${DATABASE_NAME:-notifications}
      # Read for its role name only: the bootstrap grants that role permission
      # to enqueue, which is what lets a notification and its dispatch job
      # commit in one transaction.
      DATABASE_APPLICATION_URL: postgres://${DATABASE_APPLICATION_USER:-platform_application}:${DATABASE_APPLICATION_PASSWORD:-platform_application_password}@postgres:5432/${DATABASE_NAME:-notifications}
      QUEUE_SCHEMA: ${QUEUE_SCHEMA:-pgboss}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: tools/docker/node-service.Dockerfile
      args:
        PACKAGE_NAME: "@platform/api"
    command: ["node", "dist/main.js"]
    restart: unless-stopped
    # Secrets come from .env, which `pnpm setup:env` generates. It is optional
    # here so a missing file produces the configuration validator's precise
    # list of what is absent, rather than a Compose parse error.
    env_file:
      - path: .env
        required: false
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      DATABASE_APPLICATION_URL: postgres://${DATABASE_APPLICATION_USER:-platform_application}:${DATABASE_APPLICATION_PASSWORD:-platform_application_password}@postgres:5432/${DATABASE_NAME:-notifications}
      DATABASE_SYSTEM_URL: postgres://${DATABASE_SYSTEM_USER:-platform_system}:${DATABASE_SYSTEM_PASSWORD:-platform_system_password}@postgres:5432/${DATABASE_NAME:-notifications}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # `docker compose up --watch` rebuilds and restarts on a source change.
    # File-event watching is deliberately not used: this project targets Docker
    # Desktop on Windows, where bind mounts go through 9p and inotify events do
    # not propagate — a watcher there is silently dead rather than merely slow.
    develop:
      watch:
        - action: rebuild
          path: ./apps/api/src
        - action: rebuild
          path: ./packages
          ignore:
            - "**/dist/**"
            - "**/node_modules/**"
        - action: rebuild
          path: ./pnpm-lock.yaml
    healthcheck:
      # The runtime image is deliberately slim and has no curl; Node's own
      # fetch avoids adding a package just to answer a health probe.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # The dashboard, and the single origin everything is reached through.
  #
  # A static bundle behind a file server that also forwards the API paths, so
  # the session cookie stays first-party and there is no CORS layer and no
  # compiled-in API URL anywhere.
  web:
    build:
      context: .
      dockerfile: tools/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./apps/web/src
        - action: rebuild
          path: ./apps/web/index.html
        - action: rebuild
          path: ./packages/contracts/src
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Same image as the API, different command. It is a separate service because
  # sending to WhatsApp is slow and paced, and a burst of API traffic must not
  # be able to starve delivery — nor the reverse.
  worker:
    build:
      context: .
      dockerfile: tools/docker/node-service.Dockerfile
      args:
        PACKAGE_NAME: "@platform/worker"
    command: ["node", "dist/main.js"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_APPLICATION_URL: postgres://${DATABASE_APPLICATION_USER:-platform_application}:${DATABASE_APPLICATION_PASSWORD:-platform_application_password}@postgres:5432/${DATABASE_NAME:-notifications}
      DATABASE_SYSTEM_URL: postgres://${DATABASE_SYSTEM_USER:-platform_system}:${DATABASE_SYSTEM_PASSWORD:-platform_system_password}@postgres:5432/${DATABASE_NAME:-notifications}
    # Long enough for an in-flight WhatsApp send to finish. A job killed before
    # it reports back is not lost, but it does leave an outcome nobody can
    # determine, which is the one situation worth spending patience to avoid.
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    develop:
      watch:
        - action: rebuild
          path: ./apps/worker/src
        - action: rebuild
          path: ./packages
          ignore:
            - "**/dist/**"
            - "**/node_modules/**"
        - action: rebuild
          path: ./pnpm-lock.yaml

  # The real WhatsApp provider. Exactly one of this and waha-stub runs, chosen by
  # COMPOSE_PROFILES in .env, because both answer to the hostname `waha`.
  waha:
    profiles: ["whatsapp"]
    # Pinned to a digest-stable tag rather than `latest`: the provider tracks
    # WhatsApp's own changes closely, and an unannounced upgrade here would
    # change the acknowledgement semantics the delivery rules are built on.
    image: devlikeapro/waha:noweb-2026.8.2
    restart: unless-stopped
    environment:
      # NOWEB is a websocket engine with no headless browser, so it starts in
      # seconds and avoids an entire class of Chromium failures. The namespace
      # defaults to the engine name, which means changing this forces every
      # connection to be paired again.
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY must be set; run pnpm setup:env}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    # Only needed by the Chromium-based engine, and free to set: a container
    # that runs out of shared memory fails in ways that look like WhatsApp
    # problems rather than like a container limit.
    shm_size: "1gb"
    volumes:
      - waha-sessions:/app/.sessions
      - waha-media:/app/.media
    networks:
      default:
        aliases:
          - waha
    # Deliberately not published to the network. The provider holds a paired
    # WhatsApp account and its API has no per-tenant authorization, so it is
    # infrastructure this platform speaks to, never a boundary anyone else may
    # reach. Bound to loopback only so an operator can still inspect it.
    ports:
      - "127.0.0.1:3201:3000"
    healthcheck:
      # /ping is the unauthenticated probe. /health needs the key and reports on
      # disk rather than on whether WhatsApp is connected, which is not what a
      # container probe should be asking.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Pairing state is restored at boot, which takes appreciably longer than
      # an empty start.
      start_period: 60s

  # A deterministic stand-in for WAHA, so the delivery pipeline can be exercised
  # without a phone, a scannable code, or an account that can be banned.
  # Started with: COMPOSE_PROFILES=stub docker compose up
  waha-stub:
    profiles: ["stub"]
    build:
      context: .
      dockerfile: tools/docker/node-service.Dockerfile
      args:
        PACKAGE_NAME: "@platform/waha-stub"
    command: ["node", "dist/main.js"]
    restart: unless-stopped
    environment:
      PORT: 3000
      WAHA_API_KEY: ${WAHA_API_KEY:-stub-api-key}
    # Answers to the same hostname as the real provider, so switching between
    # them is a profile flag rather than a configuration change.
    networks:
      default:
        aliases:
          - waha
    ports:
      - "127.0.0.1:3200:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ping').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:
  # The provider image declares no volumes of its own, so without these the
  # pairing is lost on every `docker compose down` and somebody has to find a
  # phone again.
  waha-sessions:
  waha-media:
